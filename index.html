<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOME</title>
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header>
        <div class="cabecalho">
            <div class="logo_app">
                <img src="assets/logo.png" alt="logo_app">
                <h1><span>Med</span>Time</h1>
            </div>
            <div class="data_hora">
                <h2>06 de Outubro, Terça-feira</h2>
                <h2>14:00</h2>
            </div>
            <div class="perfil">
                <div class="foto_perfil">
                    <h1 class="nome_perfil">RB</h1>
                </div>
                <div class="dados">
                    <h1 class="nome">Rafeal Braga</h1>
                    <h2 class="email">rafaelbraga@gmail.com</h2>
                </div>

            </div>
        </div>

        <div class="card_boas_vindas">
            <div class="bem_vindo">
                <h1>Olá, Rafael !!</h1>
                <h2>Veja como estão as pessoas que você acompanha</h2>
            </div>
            <div class="botoes_idoso">
                <div class="adicionar">
                    <img src="assets/adicionar.svg" alt="adicionar_idoso">
                    <h1>Adicionar um idoso</h1>
                </div>
                <div class="cadastrar">
                    <img src="assets/cadastrar.svg" alt="cadastrar_idoso">
                    <h1>Cadastrar um idoso</h1>
                </div>
            </div>
        </div>

        <div class="search">
            <img src="assets/pesquisar.svg" alt="icone de pesquisar">
            <div class="buscar">
                <h1>Buscar acompanhado...</h1>
            </div>
        </div>
    </header>
    <main class="container">
        <div class="cards">
            <div class="pacientes_ativos">
                <h1 class="numero_pacientes">3</h1>
                <h1 class="pacientes_ativos">Pacientes</h1>
            </div>
            <div class="alertas">
                <h1 class="numero_alerta">0</h1>
                <h1 class="alertas_pendentes">Alertas Pendentes</h1>
            </div>
        </div>
        <div class="cards_pacientes">
            <div class="cards">
                <div class="paciente">
                    
                </div>
            </div>
        </div>
    </main>
    <footer></footer>
</body>

</html>
